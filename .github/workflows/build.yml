name: Build native mod (arm64)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get Dear ImGui and Dobby
        run: |
          mkdir -p external
          git clone --depth 1 --branch v1.91.5 https://github.com/ocornut/imgui external/imgui
          git clone --depth 1 https://github.com/jmpews/Dobby external/Dobby

      - name: Build libvisualmobile.so
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          echo "NDK: $NDK"
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

      - uses: actions/upload-artifact@v4
        with:
          name: libvisualmobile
          path: build/libvisualmobile.so
          
